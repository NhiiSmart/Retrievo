version: '3.8'

services:
  # MySQL Database (mimics AWS RDS)
  db:
    image: mysql:8.0
    container_name: lost-found-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lost_found_portal
      MYSQL_USER: admin
      MYSQL_PASSWORD: secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - lost-found-network

  # Node.js Backend
  backend:
    build: .
    container_name: lost-found-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: admin
      DB_PASSWORD: secure_password
      DB_NAME: lost_found_portal
      JWT_SECRET: your-secure-jwt-secret-change-this
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: your-bucket-name
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lost-found-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mysql-data:

networks:
  lost-found-network:
    driver: bridge
